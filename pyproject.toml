[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eclipse-trajectory-tracking"
version = "0.1.0"
description = "Local-first extraction of evidence-linked Eclipse workflow trajectories from screen recordings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Thomas" }]
dependencies = [
  "av>=15,<17",
  "numpy>=1.26,<2.3",
  "pillow>=10.4,<12",
  "pyarrow>=17,<20",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
eclipse-trajectory = "eclipse_trajectory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eclipse_trajectory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["eclipse_trajectory"]

[[tool.mypy.overrides]]
module = ["av", "av.*", "pyarrow", "pyarrow.*", "yaml"]
ignore_missing_imports = true
